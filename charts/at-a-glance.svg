<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 370" width="780" height="370" role="img" aria-labelledby="t d"><title id="t">At a glance: exporting 5M rows of 7 columns from clickbench</title><desc id="d">Arrow against sliced scroll, scroll and PIT: time, data sent, CPU and heap allocated</desc>
<style>
  :root { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781; --grid:#e1e0d9; --axis:#c3c2b7;
          --s1:#2a78d6; --s2:#eb6834; --ctx:#898781; }
  @media (prefers-color-scheme: dark) {
    :root { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781; --grid:#2c2c2a; --axis:#383835;
            --s1:#3987e5; --s2:#d95926; --ctx:#898781; }
  }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 12px; fill: var(--ink2); }
  .title { font-size: 15px; font-weight: 600; fill: var(--ink); }
  .sub { font-size: 12px; fill: var(--ink2); }
  .panel { font-size: 13px; font-weight: 600; fill: var(--ink); }
  .tick { font-size: 11px; fill: var(--muted); font-variant-numeric: tabular-nums; }
  .value { font-size: 12px; fill: var(--ink2); font-variant-numeric: tabular-nums; }
  .value.em { fill: var(--ink); font-weight: 600; }
  .label { font-size: 12px; fill: var(--ink2); }
  .label.em { fill: var(--ink); font-weight: 600; }
  .note { font-size: 11px; fill: var(--muted); }
  .bg { fill: var(--surface); }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .axis { stroke: var(--axis); stroke-width: 1; }
  .ref { stroke: var(--muted); stroke-width: 1; }
  .s1 { fill: var(--s1); } .s2 { fill: var(--s2); } .ctx { fill: var(--ctx); }
  .l1 { stroke: var(--s1); } .l2 { stroke: var(--s2); }
  .line { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .dot { stroke: var(--surface); stroke-width: 2; }
</style>
